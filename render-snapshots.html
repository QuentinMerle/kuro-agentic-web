<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kuro 3D Snapshot Prerenderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 60%, #1f1f24 0%, #0d0d0f 80%);
      width: 600px;
      height: 380px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      width: 600px;
      height: 380px;
      position: relative;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

    const params = new URLSearchParams(window.location.search);
    const color = params.get("color") || "Deep Indigo";

    const width = 600;
    const height = 380;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
    // Ideal 3/4 hero sneaker view
    camera.position.set(-0.6, 0.45, 1.45);
    camera.lookAt(0, -0.05, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(2);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("stage").appendChild(renderer.domElement);

    // Studio Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8cb8ff, 1.3);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffeedd, 1.8);
    rimLight.position.set(0, -2, -3);
    scene.add(rimLight);

    // Contact shadow
    const shadowGeo = new THREE.PlaneGeometry(2.5, 2.5);
    const shadowCanvas = document.createElement("canvas");
    shadowCanvas.width = 128;
    shadowCanvas.height = 128;
    const ctx = shadowCanvas.getContext("2d");
    const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 64);
    grad.addColorStop(0, "rgba(0, 0, 0, 0.7)");
    grad.addColorStop(0.5, "rgba(0, 0, 0, 0.2)");
    grad.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);

    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const shadowMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
    });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = -0.32;
    scene.add(shadowMesh);

    const colorTunings = {
      "Obsidian Black": { color: 0x222225, roughness: 0.35, metalness: 0.1 },
      "Deep Indigo": { color: 0x2a4a85, roughness: 0.45, metalness: 0.15 },
      "Raw Chalk": { color: 0xf2eee5, roughness: 0.65, metalness: 0.05 },
    };

    const loader = new GLTFLoader();
    loader.load("/models/shoe.glb", (gltf) => {
      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.0 / maxDim;

      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));
      model.position.y += 0.02;

      // Rotate to dynamic sneaker profile
      model.rotation.y = -0.55;
      model.rotation.x = 0.08;

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (m.isMeshStandardMaterial) {
                if (color === "Raw Chalk") {
                  m.map = null;
                  m.color.setHex(0xe8e4da);
                  m.roughness = 0.75;
                  m.metalness = 0.05;
                } else if (color === "Obsidian Black") {
                  m.map = null;
                  m.color.setHex(0x1a1a1e);
                  m.roughness = 0.4;
                  m.metalness = 0.2;
                } else {
                  // Deep Indigo
                  m.color.setHex(0x2a4a85);
                  m.roughness = 0.45;
                  m.metalness = 0.15;
                }
                m.needsUpdate = true;
              }
            });
          }
        }
      });

      scene.add(model);
      renderer.render(scene, camera);
      window.__SNAPSHOT_READY__ = true;
      document.body.setAttribute("data-ready", "true");
    });
  </script>
</body>
</html>

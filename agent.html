<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuro Agent Host Simulator — MCP Apps & Schema Elicitation</title>
    <link rel="stylesheet" href="/src/design-system/tokens.css" />
    <style>
      body {
        background-color: #0d0d0d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .ide-wrapper {
        width: 100%;
        max-width: 440px;
        background-color: #141414;
        border: 1px solid #272727;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8);
      }

      .ide-header {
        padding: 12px 16px;
        background-color: #181818;
        border-bottom: 1px solid #272727;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ide-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #9B9B9B;
      }

      .ide-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--accent-success);
      }

      .ide-link {
        font-family: var(--font-mono);
        font-size: 11px;
        color: #9B9B9B;
        text-decoration: underline;
      }

      .mode-bar {
        display: flex;
        border-bottom: 1px solid #272727;
        background-color: #181818;
      }

      .mode-btn {
        flex: 1;
        padding: 10px;
        background: transparent;
        border: none;
        color: #9B9B9B;
        font-size: 12px;
        font-family: var(--font-mono);
        cursor: pointer;
        transition: all 0.2s;
      }

      .mode-btn.active {
        color: #FFFFFF;
        background-color: #1F1F1F;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #FFFFFF;
      }

      .chat-stream {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 80vh;
        overflow-y: auto;
      }

      .discovery-pill {
        align-self: center;
        font-family: var(--font-mono);
        font-size: 11px;
        color: #22C55E;
        background-color: #181818;
        border: 1px solid #272727;
        padding: 6px 12px;
        border-radius: 9999px;
        text-align: center;
      }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .msg-author {
        font-family: var(--font-mono);
        font-size: 11px;
        color: #666666;
        padding-inline: 4px;
      }

      .msg-bubble {
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      .msg-user .msg-bubble {
        background-color: #222222;
        color: #FFFFFF;
        align-self: flex-end;
      }

      .msg-agent .msg-bubble {
        background-color: #181818;
        border: 1px solid #272727;
        color: #E0E0E0;
      }

      .msg-bubble.highlight-success {
        border: 1px solid rgba(16, 185, 129, 0.4);
        background: #0d2818;
        color: #f8fafc;
      }

      .text-elicitation-box {
        background: #121212;
        border: 1px solid #272727;
        border-radius: 8px;
        padding: 12px;
        margin-top: 8px;
      }

      .field label {
        display: block;
        font-family: var(--font-mono);
        font-size: 11px;
        color: #9B9B9B;
        margin-bottom: 4px;
      }

      .select-input {
        width: 100%;
        padding: 8px;
        background: #181818;
        border: 1px solid #272727;
        border-radius: 6px;
        color: #FFFFFF;
        font-family: var(--font-sans);
        font-size: 13px;
      }

      .ux-limitation-callout {
        margin-top: 10px;
        padding: 8px 12px;
        background: #272115;
        border: 1px solid #4D3D1E;
        border-radius: 6px;
        font-size: 12px;
        color: #FBBF24;
      }

      .iframe-card {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #272727;
        background: #000000;
      }

      .iframe-badge {
        padding: 6px 10px;
        background: #181818;
        border-bottom: 1px solid #272727;
        font-family: var(--font-mono);
        font-size: 10px;
        color: #9B9B9B;
        display: flex;
        gap: 6px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="agent-root"></div>

    <script type="module">
      import { initAgentHost } from "/src/agent/agent-host.ts";
      initAgentHost(document.getElementById("agent-root"));
    </script>
  </body>
</html>

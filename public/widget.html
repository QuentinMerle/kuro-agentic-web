      };

      const inventory = {
        "KURO-V1-Obsidian Black-7": 4, "KURO-V1-Obsidian Black-8": 12, "KURO-V1-Obsidian Black-9": 10, "KURO-V1-Obsidian Black-10": 7, "KURO-V1-Obsidian Black-11": 3,
        "KURO-V1-Deep Indigo-7": 2, "KURO-V1-Deep Indigo-8": 5, "KURO-V1-Deep Indigo-9": 8, "KURO-V1-Deep Indigo-10": 4, "KURO-V1-Deep Indigo-11": 0,
        "KURO-V1-Raw Chalk-7": 6, "KURO-V1-Raw Chalk-8": 9, "KURO-V1-Raw Chalk-9": 14, "KURO-V1-Raw Chalk-10": 5, "KURO-V1-Raw Chalk-11": 2
      };

      let selectedColor = "Deep Indigo";
      let selectedSize = 9;

      const shoeImg = document.getElementById("shoe-img");
      const colorLabel = document.getElementById("color-label");
      const stockDisplay = document.getElementById("stock-display");
      const confirmBtn = document.getElementById("confirm-btn");
      const activeView = document.getElementById("active-view");
      const receiptView = document.getElementById("receipt-view");
      const receiptSummary = document.getElementById("receipt-summary");
      const receiptUrl = document.getElementById("receipt-url");
      const checkoutLink = document.getElementById("checkout-link");
      const backBtn = document.getElementById("back-btn");

      function update() {
        shoeImg.style.opacity = "0.3";
        setTimeout(() => {
          shoeImg.src = images[selectedColor];
          shoeImg.style.opacity = "1";
        }, 60);

        colorLabel.textContent = selectedColor;

        const sku = "KURO-V1-" + selectedColor + "-" + selectedSize;
        const stock = inventory[sku] ?? 0;
        const inStock = stock > 0;

        if (inStock) {
          stockDisplay.textContent = "● " + stock + " in stock";
          stockDisplay.className = "text-emerald-400";
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Confirm Configuration ($185)";
          confirmBtn.className = "w-full mt-1 py-2.5 px-4 bg-white hover:bg-zinc-200 text-black font-semibold text-xs rounded-xl shadow-lg transition-all active:scale-[0.98]";
        } else {
          stockDisplay.textContent = "✕ Sold out";
          stockDisplay.className = "text-red-400";
          confirmBtn.disabled = true;
          confirmBtn.textContent = "Size Sold Out";
          confirmBtn.className = "w-full mt-1 py-2.5 px-4 bg-zinc-800 text-zinc-500 font-semibold text-xs rounded-xl cursor-not-allowed";
        }
      }

      document.querySelectorAll(".color-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("kuro-btn-active", "text-white"));
          btn.classList.add("kuro-btn-active", "text-white");
          selectedColor = btn.getAttribute("data-color");
          update();
        });
      });

      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("kuro-btn-active"));
          btn.classList.add("kuro-btn-active");
          selectedSize = parseInt(btn.getAttribute("data-size"), 10);
          update();
        });
      });

      confirmBtn.addEventListener("click", () => {
        const sku = "KURO-V1-" + selectedColor.replace(/ /g, "-") + "-" + selectedSize;
        const url = "https://kuro-agentic-web.vercel.app/checkout?sku=" + sku + "&source=agent";

        receiptSummary.textContent = selectedColor + " · " + selectedSize + " US · $185";
        receiptUrl.textContent = url;
        checkoutLink.href = url;

        activeView.classList.add("hidden");
        receiptView.classList.remove("hidden");
      });

      backBtn.addEventListener("click", () => {
        receiptView.classList.add("hidden");
        activeView.classList.remove("hidden");
      });

      update();
